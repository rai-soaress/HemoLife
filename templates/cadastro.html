<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - HemoLife</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f8f9fa; }
        .caixa-cadastro { background: white; padding: 25px; border-radius: 10px; width: 320px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        input, select { margin-bottom: 12px; padding: 8px; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; }
        button { padding: 10px; width: 100%; cursor: pointer; background-color: #d9534f; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #c9302c; }
        .link-login { font-size: 13px; text-align: center; display: block; margin-top: 15px; color: #555; text-decoration: none; }
    </style>
</head>
<body>

    <div class="caixa-cadastro">
        <h2>Cadastro HemoLife</h2>
        
        <form action="/usuarios/cadastrar" method="POST" onsubmit="return validarSenha()">
            <label>Nome Completo:</label>
            <input type="text" name="nome" placeholder="Digite seu nome" required>

            <label>E-mail:</label>
            <input type="email" name="email" placeholder="exemplo@email.com" required>

            <label>Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

            <label>Confirmar Senha:</label>
            <input type="password" id="confirma_senha" placeholder="Repita a senha" required>

            <label>Tipo Sanguíneo:</label>
            <select name="tipo_sanguineo" required>
                <option value="" disabled selected>Selecione seu tipo</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>

            <label>Tipo de Perfil:</label>
            <select name="perfil" required>
                <option value="doador">Doador</option>
                <option value="receptor">Receptor (Quem vai receber)</option>
                <option value="admin">Administrador (Hospital)</option>
            </select>

            <button type="submit">Finalizar Cadastro</button>
        </form>

        <a href="/usuarios/login" class="link-login">Já tem uma conta? Faça login</a>
    </div>

    <script>
        function validarSenha() {
            var s = document.getElementById("senha").value;
            var c = document.getElementById("confirma_senha").value;
            if (s != c) {
                alert("As senhas não coincidem!");
                return false;
            }
            return true;
        }
    </script>

</body>
</html>
