{% extends "base.html" %}

{% block title %}Cadastro | HemoLife{% endblock %}

{% block content %}
<section class="panel auth-panel">
    <h1>Cadastro</h1>
    <form method="POST" action="{{ url_for('usuarios.cadastrar') }}">
        <label for="nome">Nome</label>
        <input id="nome" type="text" name="nome" autocomplete="name" required>

        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="email" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password" name="senha" autocomplete="new-password" required>

        <label for="perfil">Perfil</label>
        <select id="perfil" name="perfil" required>
            <option value="doador">Doador</option>
            <option value="admin">Admin</option>
        </select>

        <div id="campo_tipo_sanguineo">
            <label for="tipo_sanguineo">Tipo sanguineo</label>
            <select id="tipo_sanguineo" name="tipo_sanguineo" required>
                <option value="">Selecione</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
        </div>

        <button type="submit">Cadastrar</button>
    </form>
    <p class="muted">Ja tem conta? <a href="{{ url_for('usuarios.login') }}">Entrar</a>.</p>
</section>

<script>
    const perfilSelect = document.getElementById('perfil');
    const tipoSanguineoCampo = document.getElementById('campo_tipo_sanguineo');
    const tipoSanguineoSelect = document.getElementById('tipo_sanguineo');

    function atualizarTipoSanguineo() {
        const ehAdmin = perfilSelect.value === 'admin';

        tipoSanguineoCampo.hidden = ehAdmin;
        tipoSanguineoSelect.disabled = ehAdmin;
        tipoSanguineoSelect.required = !ehAdmin;

        if (ehAdmin) {
            tipoSanguineoSelect.value = '';
        }
    }

    perfilSelect.addEventListener('change', atualizarTipoSanguineo);
    atualizarTipoSanguineo();
</script>
{% endblock %}
