{% extends "base.html" %}

{% block title %}Minhas ONGs | HemoLife{% endblock %}

{% block content %}
<section class="page-heading">
    <h1>Minhas ONGs</h1>
    <p>ONGs em que voce esta inscrito.</p>
</section>

<section class="card-list">
    {% for ong in ongs %}
        <article class="list-card">
            <div>
                <h2>{{ ong.nome }}</h2>
                <p>{{ ong.email }}</p>
            </div>
            <form method="POST" action="{{ url_for('usuarios.cancelar', id=ong.id) }}">
                <button class="secondary" type="submit">Cancelar inscricao</button>
            </form>
        </article>
    {% else %}
        <p class="empty-state">Voce ainda nao esta inscrito em nenhuma ONG.</p>
    {% endfor %}
</section>
{% endblock %}
