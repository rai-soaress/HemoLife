{% extends "base.html" %}

{% block title %}Login | HemoLife{% endblock %}

{% block content %}
<section class="panel auth-panel">
    <h1>Login</h1>
    <form method="POST" action="{{ url_for('usuarios.login') }}">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="email" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password" name="senha" autocomplete="current-password" required>

        <button type="submit">Entrar</button>
    </form>
    <p class="muted">Ainda nao tem conta? <a href="{{ url_for('usuarios.cadastrar') }}">Cadastre-se</a>.</p>
</section>
{% endblock %}
